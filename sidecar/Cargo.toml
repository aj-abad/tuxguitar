[package]
name = "tuxguitar-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tuxguitar-sidecar"
path = "src/main.rs"

[dependencies]
cpal        = "0.15"
oxisynth    = "0.0.2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
