appId: com.ajabad.tabbycat
productName: Tabbycat
directories:
  output: release
  buildResources: electron/resources
files:
  - dist-electron/**
  - .output/public/**
  - package.json
beforePack: scripts/prepare-sidecar.mjs
extraResources:
  - from: sidecar/bin/${os}-${arch}
    to: sidecar
    filter:
      - '**/*'
      - '!*.pdb'
  - from: sidecar/bin/GeneralUser.sf2
    to: sidecar/GeneralUser.sf2
mac:
  target:
    - dmg
  category: public.app-category.music
  hardenedRuntime: true
  # Icon Composer source. electron-builder 26.8+ runs actool (Xcode 26) to emit
  # the icns + Liquid-Glass Assets.car and sets CFBundleIconName. macOS 26 glass.
  icon: electron/resources/icon.icon
